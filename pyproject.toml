[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "huamao-bkv"
version = "0.1.0"
description = "B-KV: native writable K/V memory outside a frozen small language model (write / fuzzy recall / overwrite / injection)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
]

[project.optional-dependencies]
bench = ["pandas", "pyarrow", "huggingface_hub"]

[tool.setuptools.packages.find]
include = ["huamao_bkv*"]